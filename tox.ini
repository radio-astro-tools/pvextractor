[tox]
envlist =
    py{310,311,312,313}-test{,-oldestdeps,-devdeps,-viz,-cov}
    build_docs
    codestyle
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
    tox-uv
isolated_build = true

[testenv]
passenv =
    HOME
    DISPLAY
    LC_ALL
    LC_CTYPE
    ON_TRAVIS
setenv =
    # Install nightly builds with uv (see radio-astro-tools/spectral-cube#994)
    devdeps: UV_INDEX = https://pypi.anaconda.org/liberfa/simple https://pypi.anaconda.org/astropy/simple https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
    devdeps: UV_INDEX_STRATEGY = unsafe-best-match
    devdeps: UV_PRERELEASE = allow
changedir =
    .tmp/{envname}
description =
    run tests with pytest
uv_resolution =
    # The oldestdeps factor is intended to be used to install
    # the oldest versions of all dependencies
    oldestdeps: lowest-direct
deps =
    devdeps: numpy>=0.0.dev0
    devdeps: pyerfa>=0.0.dev0
    devdeps: astropy>=0.0.dev0
    devdeps: spectral-cube @ git+https://github.com/radio-astro-tools/spectral-cube
    viz: PyQt6
extras =
    test
commands =
    {list_dependencies_command}
    !cov: pytest --pyargs pvextractor --cov pvextractor --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: pytest --pyargs {toxinidir}/docs --cov pvextractor --cov-append --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml

[testenv:build_docs]
changedir =
    docs
description =
    invoke sphinx-build to build the HTML docs
extras =
    docs
commands =
    sphinx-build -W -b html . _build/html {posargs}

[testenv:codestyle]
deps = flake8
skip_install = true
commands =
    flake8 --max-line-length=100 pvextractor
